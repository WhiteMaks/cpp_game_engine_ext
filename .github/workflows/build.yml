name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.config }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-debug
            config: Debug

          - os: ubuntu-latest
            preset: linux-release
            config: Release

          - os: windows-latest
            preset: windows-debug
            config: Debug

          - os: windows-latest
            preset: windows-release
            config: Release

          - os: macos-latest
            preset: macos-debug
            config: Debug

          - os: macos-latest
            preset: macos-release
            config: Release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.3'

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Install
        run: cmake --install build/${{ matrix.preset }} --config ${{ matrix.config }}
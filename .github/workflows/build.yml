name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.config }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux
            config: debug

          - os: ubuntu-24.04
            preset: linux
            config: release

          - os: windows-latest
            preset: windows
            config: debug

          - os: windows-latest
            preset: windows
            config: release

          - os: macos-latest
            preset: macos
            config: debug

          - os: macos-latest
            preset: macos
            config: release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.3'

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}-${{ matrix.config}}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-${{ matrix.config}} --parallel
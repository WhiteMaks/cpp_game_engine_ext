name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.config }})

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        config:
          - Debug
          - Release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.3'

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Setup MacOS
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_CXX_FLAGS="-std=c++2c"
          
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_CXX_FLAGS="/std:c++latest"

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
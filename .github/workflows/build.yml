name: Build

on:
  push:

jobs:
  build:
    name: Build (${{ matrix.preset }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-debug
            config: Debug

          - os: ubuntu-latest
            preset: linux-release
            config: Release

          - os: windows-latest
            preset: windows-debug
            config: Debug

          - os: windows-latest
            preset: windows-release
            config: Release

          - os: macos-latest
            preset: macos-debug
            config: Debug

          - os: macos-latest
            preset: macos-release
            config: Release

          - os: ubuntu-latest
            preset: web-debug
            config: Debug
            emscripten: true

          - os: ubuntu-latest
            preset: web-release
            config: Release
            emscripten: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.3'

      - name: Install SDL3 dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev

      - name: Setup Ninja
        if: matrix.emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Emscripten SDK
        if: matrix.emscripten
        run: |
          ./.tools/emsdk/emsdk install latest
          ./.tools/emsdk/emsdk activate latest

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Install
        run: cmake --install build/${{ matrix.preset }} --config ${{ matrix.config }}